<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default site.Language.Lang }}" itemscope itemtype="http://schema.org/WebPage">
<head>
  {{ partial "head.html" . }}
  {{ partial "style.html" . }}
</head>
<body class="{{ if .IsHome }}page-home{{ else }}page-text{{ end }}">
  {{ if hugo.IsProduction }}{{ partialCached "gtm-noscript.html" . }}{{ end }}
  <a class="skip-link" href="#main">{{ i18n "skip_to_content" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "script.html" . }}
</body>
</html>
